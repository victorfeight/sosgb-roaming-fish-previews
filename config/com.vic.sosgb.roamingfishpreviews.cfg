## Roaming Fish Previews 0.15.1 aligned-approach, finite-bite, and shoreline-reaction preset
## Each fishing pool creates a size-scaled finite school before it enters normal
## camera range. Distant visuals unload without forgetting the fish. Catches
## recover slowly, one fish at a time, without rebuilding the whole field.

[General]
Enabled = true

[Population]
## Global cap for simultaneously loaded visuals; schools themselves persist.
VisibleFish = 18
MinimumFishPerPool = 4
MaximumFishPerPool = 12
PoolLoadDistance = 26
PoolUnloadDistance = 38
RespawnSeconds = 120

[Visual]
RoamRadius = 0.34
RoamSpeed = 0.55
SwimAcceleration = 0.75
SwimTurnRate = 105
SurfaceOffset = 0.025
## Native mesh upper edge relative to water; positive values raise it.
NativeSurfaceOffset = 0.020
## Constant world-space depth prevents large 3D catch models looking submerged.
NativeShadowThickness = 0.045
ShadowSize = 1.0
## Head-anchored traveling spine; 0.065 gives a 6.5% base tail-wave amplitude.
BodyFlex = 0.065

[Gameplay]
## The nearest eligible fish inside this radius pursues the bobber.
SelectionRadius = 3.0
ApproachSpeed = 2.1
BiteDistance = 0.20
## When true, off-target casts remain waiting and cannot roll an invisible fish.
StrictFiniteMode = true

[BiteBehavior]
## Visible test nibbles occur before the final native A-button bite.
MinimumFakeNibbles = 1
MaximumFakeNibbles = 3
NibbleCycleSeconds = 0.78
NibbleRetreatDistance = 0.28
## Missed/cancelled targets visibly accelerate away before despawning.
EscapeSeconds = 1.45
EscapeSpeed = 1.8

[SchoolReaction]
## Nearby fish in the same connected pond flee through valid adjacent water cells.
ScatterRadius = 3.25
ScatterSeconds = 2.1
ScatterSpeed = 1.35
## Walking is safe; actual running near visible fish disturbs the water.
RunScatterEnabled = true
RunScatterRadius = 4.25
RunScatterCooldown = 0.75
RunScatterMinimumSpeed = 1.75

[Diagnostics]
VerboseTrace = false
